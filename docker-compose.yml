version: '3.8'

services:
  api:
    build: .
    container_name: docchat-api
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=.

  ui:
    build: .
    container_name: docchat-ui
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000